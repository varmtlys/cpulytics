name: release

# Pushing a version tag is the whole release procedure: vMAJOR.MINOR for features,
# vMAJOR.MINOR.PATCH for fixes. The binary carries the tag as its version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Build and test x64
        shell: pwsh
        run: .\scripts\build.ps1 --arch x64 --test

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build and test x86
        shell: pwsh
        run: .\scripts\build.ps1 --arch x86 --test

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Build arm64
        shell: pwsh
        run: .\scripts\build.ps1 --arch arm64 --test  # cross build, the tests only compile here

      # The binary needs no companion files, so it is published as it is: one exe
      # per architecture, named after it, nothing to unpack before running.
      - name: Name the binaries
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in 'x64', 'x86', 'arm64') {
            Copy-Item "build\$arch\cpulytics.exe" "dist\cpulytics-$tag-windows-$arch.exe"
          }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = 'x64', 'x86', 'arm64' | ForEach-Object { "dist\cpulytics-$tag-windows-$_.exe" }
          $ghArgs = @('release', 'create', $tag) + $files + @('--title', $tag)
          if (Test-Path RELEASE_NOTES.md) { $ghArgs += @('--notes-file', 'RELEASE_NOTES.md') }
          else { $ghArgs += '--generate-notes' }
          gh @ghArgs
