name: release

# Pushing a version tag is the whole release procedure: vMAJOR.MINOR for features,
# vMAJOR.MINOR.PATCH for fixes. The binary carries the tag as its version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Build and test x64
        shell: pwsh
        run: .\scripts\build.ps1 -Arch x64 -Test

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build and test x86
        shell: pwsh
        run: .\scripts\build.ps1 -Arch x86 -Test

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Build arm64
        shell: pwsh
        run: .\scripts\build.ps1 -Arch arm64 -Test  # cross build, the tests only compile here

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          foreach ($arch in 'x64', 'x86', 'arm64') {
            New-Item -ItemType Directory -Force "dist\$arch" | Out-Null
            Copy-Item "build\$arch\cpulytics.exe", README.md "dist\$arch\"
            Compress-Archive -Path "dist\$arch\*" -DestinationPath "cpulytics-$tag-windows-$arch.zip"
          }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zips = 'x64', 'x86', 'arm64' | ForEach-Object { "cpulytics-$tag-windows-$_.zip" }
          $ghArgs = @('release', 'create', $tag) + $zips + @('--title', $tag)
          if (Test-Path RELEASE_NOTES.md) { $ghArgs += @('--notes-file', 'RELEASE_NOTES.md') }
          else { $ghArgs += '--generate-notes' }
          gh @ghArgs
