name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc: amd64
          - arch: x86
            msvc: x86
          - arch: arm64
            msvc: amd64_arm64  # cross build, its tests are compiled but not run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.ps1 takes the version from git describe

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Build and test
        shell: pwsh
        run: .\scripts\build.ps1 -Arch ${{ matrix.arch }} -Test

      - uses: actions/upload-artifact@v4
        with:
          name: cpulytics-${{ matrix.arch }}-${{ github.sha }}
          path: build/${{ matrix.arch }}/cpulytics.exe
